superjob:
  base_url: "https://api.superjob.ru/2.0"
  key_env: SUPERJOB_KEY
  page_size: 40
  delay_ms: 300

trudvsem:
  base_url: "https://opendata.trudvsem.ru/api/v1"
  region: "5500000000000"
  max_records: 150

# hh.ru: официальный API закрыт для соискателей (403), берём выдачу из
# JSON-состояния страницы поиска. area 68 - Омск, 113 - вся Россия.
# Удалёнка по РФ даёт ~1700 вакансий за 2 дня, поэтому страниц меньше.
hh:
  enabled: true
  base_url: "https://hh.ru"
  area_omsk: 68
  area_remote: 113
  experience: noExperience
  search_period_days: 2
  max_pages_omsk: 15
  max_pages_remote: 12
  delay_ms: 1500
  # Резидентный прокси нужен, только если hh начнёт отдавать 403/капчу с IP Amvera.
  proxy_env: HH_PROXY

search:
  town_omsk: 17
  remote_keywords: [помощник, оператор, младший, стажёр, junior, поддержка]

# Координаты "дома" для сортировки по близости. Сейчас — центр Омска, поменяй под себя.
home:
  lat: 54.9893
  lng: 73.3682

filter:
  # Порог сбора ниже, чем дефолт пользователя (40 000): джуны в Омске часто
  # стартуют с 30–35к. В выдачу их отберёт личный порог из настроек.
  salary_min: 30000
  keep_unknown_salary: true
  allowed_experience: [Без опыта, Не имеет значения, От 1 года]
  stop_words: [продаж, холодные звонки, колл-центр, call-центр, взыскан, телемаркетинг, без оплаты, оплата по результату]
  # Выбрасывают вакансию, если встретились в названии, компании или описании
  drop_words: [военнослужащ, по контракту, беспилотн, вахт]
  # Выбрасывают только по названию: медицина, образование, торговый зал, заграничные стройки.
  # Рабочие специальности и курьеры не отсеиваются — их отбирают сферы пользователя.
  title_drop_words: [уборщик, повар, пекар, продавец, охранник, дворник, учител, преподавател, педагог, воспитател, репетитор, врач, медицин, фельдшер, медсестр, поликлиник, стоматолог, фармацевт, санитар, египет, сирия, африка, китай]
  exclude_companies: []

rank:
  top_n: 10

# Твой telegram user_id: бот пришлёт уведомление о каждом донате.
# Оставь пустым или удали строку — уведомления просто не будут отправляться.
admin_id: 1318155081

bot:
  token_env: BOT_TOKEN
  # Раз в столько часов уходит дайджест (после обновления базы в refresh_hour)
  digest_hours: 48
  # Во сколько утра обновлять базу вакансий
  refresh_hour: 9
